# fancysauce-savings — Codex managed-hook telemetry (deploy via MDM or /etc/codex).
#
# Deploy THIS file to ONE of:
#   - macOS MDM key com.openai.codex:requirements_toml_base64
#   - /etc/codex/requirements.toml            (macOS/Linux)
#   - %ProgramData%\OpenAI\Codex\requirements.toml  (Windows)
# Codex COMPOSES every requirements layer that is present rather than letting the
# highest-precedence one win, so a scalar two layers set to different values is a
# hard startup failure, not an override.
# Also deliver the wrapper script to /etc/codex/hooks and the credentials.json file
# (see release/templates/mdm/README.md — same file Claude Code uses).
#
# Enforced hooks are auto-trusted: they run zero-step with no user prompt.

[features]
hooks = true

[hooks]
# `managed_dir` is deliberately NOT set. It is optional — it neither grants hooks
# their auto-trust (the requirements layer does that) nor constrains where hook
# commands may live — and every `command` below is already an absolute path, so
# setting it would buy nothing. It is also a scalar, so any OTHER tool writing a
# requirements layer with a different `managed_dir` (e.g. a per-user CLI installer
# writing com.openai.codex:requirements_toml_base64) would collide with ours and
# stop Codex from starting at all. Leaving it unset makes us compose with anyone.

# ---------------------------------------------------------------------------
# Choose ONE mode by editing the `command` lines below.
#   PINNED  (recommended): --ref <tag> --sha <commit-sha>   (deterministic, audited)
#   FLOATING (opt-in):     --ref latest                     (auto-updates each session)
# The example below is PINNED to v0.12.0. Replace the tag+sha to upgrade, or
# swap every command to `... <Event> --ref latest` for floating.
# Floating example (per event):  /etc/codex/hooks/wrapper SessionStart --ref latest
# ---------------------------------------------------------------------------

[[hooks.SessionStart]]
matcher = ""
[[hooks.SessionStart.hooks]]
type = "command"
command = "/etc/codex/hooks/fancysauce.sh SessionStart --ref v0.12.0 --sha b3e046e7f4511b935e075c6a1c3cc9e72678e3c6"

[[hooks.UserPromptSubmit]]
