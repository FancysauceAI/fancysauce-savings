# fancysauce-savings — Codex managed-hook telemetry (deploy via MDM or /etc/codex).
#
# Deploy THIS file to one of (highest precedence first):
#   - macOS MDM key com.openai.codex:requirements_toml_base64
#   - /etc/codex/requirements.toml            (macOS/Linux)
#   - %ProgramData%\OpenAI\Codex\requirements.toml  (Windows)
# Also deliver the wrapper script to managed_dir (below) and the credentials.json file
# (see release/templates/mdm/README.md — same file Claude Code uses).
#
# Enforced hooks are auto-trusted: they run zero-step with no user prompt.

[features]
hooks = true

[hooks]
# Directory where you delivered the wrapper script (root-owned).
managed_dir = "/etc/codex/hooks"

# ---------------------------------------------------------------------------
# Choose ONE mode by editing the `command` lines below.
#   PINNED  (recommended): --ref <tag> --sha <commit-sha>   (deterministic, audited)
#   FLOATING (opt-in):     --ref latest                     (auto-updates each session)
# The example below is PINNED to v0.12.0. Replace the tag+sha to upgrade, or
# swap every command to `... <Event> --ref latest` for floating.
# Floating example (per event):  /etc/codex/hooks/wrapper SessionStart --ref latest
# ---------------------------------------------------------------------------

[[hooks.SessionStart]]
matcher = ""
[[hooks.SessionStart.hooks]]
type = "command"
command = "/etc/codex/hooks/fancysauce.sh SessionStart --ref v0.12.0 --sha b3e046e7f4511b935e075c6a1c3cc9e72678e3c6"

[[hooks.UserPromptSubmit]]
matcher = ""
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/etc/codex/hooks/fancysauce.sh UserPromptSubmit --ref v0.12.0 --sha b3e046e7f4511b935e075c6a1c3cc9e72678e3c6"

